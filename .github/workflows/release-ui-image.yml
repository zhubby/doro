name: Release UI Image

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish. Defaults to the selected ref name.
        required: false
        type: string
      publish_latest:
        description: Also publish the latest tag.
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: release-ui-image-${{ github.event.release.tag_name || inputs.image_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push ui
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release metadata
        id: release
        shell: bash
        run: |
          image_tag="${{ github.event.release.tag_name || inputs.image_tag || github.ref_name }}"
          publish_latest="${{ github.event_name == 'release' && !github.event.release.prerelease || github.event_name == 'workflow_dispatch' && inputs.publish_latest }}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "publish_latest=${publish_latest}" >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}-ui" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.release.outputs.image_tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.publish_latest == 'true' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./doro-ui
          file: ./doro-ui/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=doro-ui
          cache-to: type=gha,mode=max,scope=doro-ui
