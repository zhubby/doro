services:
  control-plane:
    image: doro:local
    container_name: doro-control-plane
    command: ["control-plane"]
    ports:
      - "8787:8787"
      - "8788:8788"
    environment:
      - DORO_CONTROL_PLANE_DATABASE_URL=postgres://doro:doro@host.docker.internal:5432/doro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  doro-ui:
    image: doro-ui:local
    container_name: doro-ui
    ports:
      - "3000:3000"
    environment:
      - DORO_CONTROL_PLANE_URL=http://control-plane:8787
    depends_on:
      - control-plane
    restart: unless-stopped
