services:
  control-plane:
    image: doro:local
    container_name: doro-control-plane
    command: ["--config", "/etc/doro/control-plane.toml", "control-plane"]
    ports:
      - "8787:8787"
      - "8788:8788"
    volumes:
      - ./docker/control-plane.toml:/etc/doro/control-plane.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  doro-ui:
    image: doro-ui:local
    container_name: doro-ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_DORO_CONTROL_PLANE_URL=http://localhost:8787
    depends_on:
      - control-plane
    restart: unless-stopped
