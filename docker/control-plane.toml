[server]
console_bind = "0.0.0.0:8787"
agent_bind = "0.0.0.0:8788"

[store]
backend = "postgres"
database_url = "postgres://postgres:postgres@host.docker.internal:25432/doro"
max_connections = 10
min_connections = 1
connect_timeout_seconds = 8
idle_timeout_seconds = 300

[security]
approval_policy = "policy_and_human_approval"
require_tls = false

[websites]
enabled = true
http_bind = "0.0.0.0:8080"

[ai]
provider = "disabled"
