syntax = "proto3";

package doro.agent.v1;

import "google/protobuf/timestamp.proto";

service AgentControlPlane {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc ReportHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc OpenAgentStream(stream AgentEvent) returns (stream ControlPlaneCommand);
}

message EnrollRequest {
  string enrollment_token = 1;
  string hostname = 2;
  repeated AgentCapability capabilities = 3;
  string system_profile_json = 4;
}

message EnrollResponse {
  string agent_id = 1;
  string host_id = 2;
  string control_plane_id = 3;
}

message HeartbeatRequest {
  string agent_id = 1;
  string host_id = 2;
  google.protobuf.Timestamp observed_at = 3;
  repeated AgentCapability capabilities = 4;
  string system_profile_json = 5;
}

message HeartbeatResponse {
  bool accepted = 1;
  string message = 2;
}

message AgentEvent {
  string event_id = 1;
  string agent_id = 2;
  string host_id = 3;
  google.protobuf.Timestamp recorded_at = 4;
  oneof event {
    ConnectedEvent connected = 5;
    HeartbeatEvent heartbeat = 6;
    MetricsSnapshotEvent metrics_snapshot = 7;
    ContainerSnapshotEvent container_snapshot = 8;
    CollectorErrorEvent collector_error = 9;
    CommandResultEvent command_result = 10;
    TerminalCommandResultEvent terminal_command_result = 11;
    TerminalOutputEvent terminal_output = 12;
    TerminalSessionClosedEvent terminal_session_closed = 13;
    LogLineEvent log_line = 14;
    VirtualMachineSnapshotEvent virtual_machine_snapshot = 15;
    VirtualMachineCommandResultEvent virtual_machine_command_result = 16;
    FileCommandResultEvent file_command_result = 17;
    AgentTaskProgressEvent agent_task_progress = 18;
    AgentTaskResultEvent agent_task_result = 19;
    AgentToolApprovalRequestEvent agent_tool_approval_request = 20;
    WebsiteRoutesAppliedEvent website_routes_applied = 21;
    AgentChatTextDeltaEvent agent_chat_text_delta = 22;
    AgentChatToolEvent agent_chat_tool = 23;
    AgentChatTurnResultEvent agent_chat_turn_result = 24;
    DockerCommandResultEvent docker_command_result = 25;
  }
}

message ControlPlaneCommand {
  string command_id = 1;
  google.protobuf.Timestamp issued_at = 2;
  oneof command {
    AckCommand ack = 3;
    CollectContainersCommand collect_containers = 4;
    ShutdownCommand shutdown = 5;
    RunTerminalCommandCommand run_terminal_command = 6;
    OpenTerminalSessionCommand open_terminal_session = 7;
    TerminalInputCommand terminal_input = 8;
    ResizeTerminalSessionCommand resize_terminal_session = 9;
    CloseTerminalSessionCommand close_terminal_session = 10;
    CollectVirtualMachinesCommand collect_virtual_machines = 11;
    RunVirtualMachineCommandCommand run_virtual_machine_command = 12;
    ListDirectoryCommand list_directory = 13;
    ReadFileCommand read_file = 14;
    SearchFilesCommand search_files = 15;
    RunFileOperationCommand run_file_operation = 16;
    RunAgentTaskCommand run_agent_task = 17;
    AgentToolApprovalDecisionCommand agent_tool_approval_decision = 18;
    ApplyWebsiteRoutesCommand apply_website_routes = 19;
    RunAgentChatTurnCommand run_agent_chat_turn = 20;
    RunDockerCommandCommand run_docker_command = 21;
    CancelCommand cancel_command = 22;
  }
}

message AckCommand {
  string message = 1;
}

message CollectContainersCommand {
  string runtime = 1;
}

message CollectVirtualMachinesCommand {
  string provider = 1;
}

message RunVirtualMachineCommandCommand {
  string command_id = 1;
  string command_json = 2;
}

message RunDockerCommandCommand {
  string command_id = 1;
  string command_json = 2;
}

message ListDirectoryCommand {
  string command_id = 1;
  string path = 2;
}

message ReadFileCommand {
  string command_id = 1;
  string path = 2;
}

message SearchFilesCommand {
  string command_id = 1;
  string path = 2;
  string query = 3;
  uint32 limit = 4;
}

message RunFileOperationCommand {
  string command_id = 1;
  string operation = 2;
  string path = 3;
  string target_path = 4;
  string name = 5;
  bytes content = 6;
  bool overwrite = 7;
}

message RunAgentTaskCommand {
  string command_id = 1;
  string task_id = 2;
  string scheduled_task_id = 3;
  string prompt = 4;
  string template_json = 5;
  AgentAiProviderConfig ai_provider = 6;
}

message RunAgentChatTurnCommand {
  string command_id = 1;
  string conversation_id = 2;
  string user_message_id = 3;
  string assistant_message_id = 4;
  string task_id = 5;
  string messages_json = 6;
  AgentAiProviderConfig ai_provider = 7;
}

message AgentAiProviderConfig {
  string provider_type = 1;
  string name = 2;
  string base_url = 3;
  string model = 4;
  string api_key = 5;
  uint32 timeout_seconds = 6;
}

message AgentToolApprovalDecisionCommand {
  string request_id = 1;
  string task_id = 2;
  string step_id = 3;
  bool approved = 4;
  string message = 5;
}

message CancelCommand {
  string command_id = 1;
  string target_command_id = 2;
  string reason = 3;
}

message ApplyWebsiteRoutesCommand {
  string command_id = 1;
  repeated WebsiteRoute routes = 2;
}

message WebsiteRoute {
  string website_id = 1;
  string primary_domain = 2;
  repeated string aliases = 3;
  string status = 4;
  string kind = 5;
  string protocol = 6;
  uint32 listen_port = 7;
  string upstream_url = 8;
  string config_json = 9;
}

message ShutdownCommand {
  string reason = 1;
}

message RunTerminalCommandCommand {
  string command_id = 1;
  string input = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  uint32 timeout_seconds = 5;
}

message OpenTerminalSessionCommand {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message TerminalInputCommand {
  string session_id = 1;
  string data = 2;
}

message ResizeTerminalSessionCommand {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message CloseTerminalSessionCommand {
  string session_id = 1;
  string reason = 2;
}

message ConnectedEvent {
  string protocol_version = 1;
  string hostname = 2;
}

message HeartbeatEvent {
  string protocol_version = 1;
}

message MetricsSnapshotEvent {
  string host_id = 1;
  google.protobuf.Timestamp captured_at = 2;
  float cpu_percent = 3;
  float memory_percent = 4;
  float disk_percent = 5;
  float load_average = 6;
  string extra_json = 7;
}

message ContainerSnapshotEvent {
  string command_id = 1;
  string runtime = 2;
  repeated ContainerObservation containers = 3;
  string extra_json = 4;
}

message ContainerObservation {
  string id = 1;
  repeated string names = 2;
  string image = 3;
  string image_id = 4;
  string command = 5;
  int64 created = 6;
  string ports_json = 7;
  string labels_json = 8;
  string state = 9;
  string status = 10;
}

message VirtualMachineSnapshotEvent {
  string command_id = 1;
  string provider = 2;
  repeated VirtualMachineObservation virtual_machines = 3;
  string extra_json = 4;
}

message VirtualMachineObservation {
  string vm_ref = 1;
  string name = 2;
  string status = 3;
  uint32 cpu_cores = 4;
  uint32 memory_mib = 5;
  uint32 disk_gb = 6;
  string image = 7;
  string networks_json = 8;
  string console_json = 9;
  string metadata_json = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp observed_at = 12;
}

message CollectorErrorEvent {
  string command_id = 1;
  string collector = 2;
  string message = 3;
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_SUCCEEDED = 1;
  COMMAND_STATUS_FAILED = 2;
  COMMAND_STATUS_CANCELLED = 3;
}

message CommandResultEvent {
  string command_id = 1;
  CommandStatus status = 2;
  string message = 3;
}

message TerminalCommandResultEvent {
  string command_id = 1;
  CommandStatus status = 2;
  string output = 3;
  int32 exit_code = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
}

message VirtualMachineCommandResultEvent {
  string command_id = 1;
  CommandStatus status = 2;
  string message = 3;
  string details_json = 4;
}

message DockerCommandResultEvent {
  string command_id = 1;
  CommandStatus status = 2;
  string message = 3;
  string details_json = 4;
}

message FileCommandResultEvent {
  string command_id = 1;
  CommandStatus status = 2;
  string message = 3;
  string result_json = 4;
  bytes content = 5;
}

message WebsiteRoutesAppliedEvent {
  string command_id = 1;
  CommandStatus status = 2;
  string message = 3;
  uint32 route_count = 4;
  repeated string website_ids = 5;
}

message AgentTaskProgressEvent {
  string command_id = 1;
  string task_id = 2;
  string step_id = 3;
  string status = 4;
  string message = 5;
  string details_json = 6;
}

message AgentTaskResultEvent {
  string command_id = 1;
  string task_id = 2;
  CommandStatus status = 3;
  string summary = 4;
  string result_json = 5;
}

message AgentToolApprovalRequestEvent {
  string request_id = 1;
  string command_id = 2;
  string task_id = 3;
  string tool_call_id = 4;
  string tool_name = 5;
  string risk = 6;
  string summary = 7;
  string arguments_json = 8;
}

message AgentChatTextDeltaEvent {
  string command_id = 1;
  string conversation_id = 2;
  string message_id = 3;
  string task_id = 4;
  string delta = 5;
}

message AgentChatToolEvent {
  string command_id = 1;
  string conversation_id = 2;
  string message_id = 3;
  string task_id = 4;
  string kind = 5;
  string tool_call_id = 6;
  string tool_name = 7;
  string status = 8;
  string content = 9;
  string payload_json = 10;
}

message AgentChatTurnResultEvent {
  string command_id = 1;
  string conversation_id = 2;
  string message_id = 3;
  string task_id = 4;
  CommandStatus status = 5;
  string message = 6;
  string result_json = 7;
}

message TerminalOutputEvent {
  string session_id = 1;
  string data = 2;
}

message TerminalSessionClosedEvent {
  string session_id = 1;
  string reason = 2;
}

message LogLineEvent {
  string log_id = 1;
  string level = 2;
  string target = 3;
  string message = 4;
  string fields_json = 5;
}

message AgentCapability {
  string name = 1;
  string risk = 2;
  string description = 3;
}
